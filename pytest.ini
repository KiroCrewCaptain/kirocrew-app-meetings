[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    ipv6_required: binds the IPv6 loopback; skipped where the host has none
filterwarnings =
    error
    # The tests stand in for the gateway, which keys its own app and request
    # storage with plain strings; the app reads those same keys.
    ignore::aiohttp.web_exceptions.NotAppKeyWarning
    # The body-cap tests send an oversized raw body on purpose.
    ignore:Sending a large body directly with raw bytes:ResourceWarning
    # The paste tests post a raw bytes form field, the way the browser's upload arrives.
    ignore:In v4, passing bytes will no longer create a file field:DeprecationWarning
